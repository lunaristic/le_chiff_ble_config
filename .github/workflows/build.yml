name: Build ZMK firmware

on:
  push:
    paths:
      - ".github/workflows/build.yml"
      - "zmk-config/**"
  pull_request:
    paths:
      - ".github/workflows/build.yml"
      - "zmk-config/**"
  workflow_dispatch:

jobs:
  build:
    uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@v0.3
    with:
      config_path: zmk-config
      build_matrix_path: zmk-config/build.yaml
